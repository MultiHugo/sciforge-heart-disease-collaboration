  <title>Heart Disease: cross-review and the supplementary VA audit</title>
  <desc>Three local analyses lead to a review of VA accuracy and AUROC. A later audit finds 34 correct predictions, versus 35 for the all-positive baseline, among 45 test cases.</desc>
