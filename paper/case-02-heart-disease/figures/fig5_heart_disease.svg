<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Heart Disease collaboration and VA diagnostic</title>
  <desc id="desc">Two-panel figure showing aggregate-only research handoffs across Cleveland, Hungarian and VA partitions, followed by a supplementary VA diagnostic.</desc>
  <defs>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#17324D}.sub{font:20px Arial,Helvetica,sans-serif;fill:#5B677A}.h{font:700 24px Arial,Helvetica,sans-serif;fill:#17324D}.body{font:21px Arial,Helvetica,sans-serif;fill:#17324D}.small{font:20px Arial,Helvetica,sans-serif;fill:#5B677A}.white{fill:#fff}.metric{font:700 34px Arial,Helvetica,sans-serif;fill:#17324D}.center{text-anchor:middle}.left{text-anchor:start}
    </style>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2D6CDF"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1F9D8B"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#E98B2A"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <rect x="20" y="20" width="940" height="860" rx="18" fill="#fff" stroke="#D6DDE7" stroke-width="2"/>
  <rect x="980" y="20" width="600" height="860" rx="18" fill="#fff" stroke="#D6DDE7" stroke-width="2"/>

  <text x="50" y="72" class="title">a  Collaborative handoff and cross-review</text>
  <text x="50" y="102" class="sub">Single operator · three accounts · separate directories</text>
  <rect x="60" y="140" width="250" height="130" rx="14" fill="#EAF1FF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="78" y="176" class="h">Role B · Cleveland</text><text x="78" y="211" class="body">303 retained</text><text x="78" y="241" class="body">AUROC 0.8787</text>
  <rect x="345" y="140" width="250" height="130" rx="14" fill="#E8F7F4" stroke="#1F9D8B" stroke-width="2"/>
  <text x="363" y="176" class="h">Role C · Hungarian</text><text x="363" y="211" class="body">261 retained</text><text x="363" y="241" class="body">AUROC 0.9044</text>
  <rect x="630" y="140" width="250" height="130" rx="14" fill="#FFF3E8" stroke="#E98B2A" stroke-width="2"/>
  <text x="648" y="176" class="h">Role D · VA</text><text x="648" y="211" class="body">130 retained</text><text x="648" y="241" class="body">AUROC 0.5629</text>

  <path d="M185 270 V320 H400 V355" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M470 270 V355" fill="none" stroke="#1F9D8B" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M755 270 V320 H580 V355" fill="none" stroke="#E98B2A" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <rect x="300" y="360" width="380" height="125" rx="14" fill="#F5F7FA" stroke="#6B7C93" stroke-width="2"/>
  <text x="490" y="398" class="h center">SciForge project</text><text x="490" y="432" class="body center">aggregate results only</text><text x="490" y="462" class="small center">method · counts · test metrics</text>
  <path d="M490 485 V548" fill="none" stroke="#2D6CDF" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="335" y="555" width="310" height="90" rx="14" fill="#EAF1FF" stroke="#2D6CDF" stroke-width="2"/>
  <text x="490" y="594" class="h center">Role B integrates</text><text x="490" y="623" class="body center">shared research record</text>
  <path d="M490 645 V692" fill="none" stroke="#E98B2A" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-orange)"/>
  <text x="505" y="678" class="small">review</text>
  <rect x="80" y="700" width="800" height="105" rx="14" fill="#FFF8EC" stroke="#E98B2A" stroke-width="2"/>
  <text x="102" y="738" class="h">Role C cross-review</text><text x="330" y="738" class="body">· Why accuracy 0.7556 with AUROC 0.5629?</text>
  <text x="102" y="775" class="small">Revision: report prevalence, discrimination and uncertainty together</text>
  <text x="490" y="850" class="small center" font-style="italic">Local row handling was not a validated security boundary.</text>

  <text x="1010" y="72" class="title">b  VA diagnostic</text>
  <text x="1010" y="102" class="sub">supplementary recomputation · 2026-11-22</text>
  <text x="1020" y="155" class="h">Test labels · 45 samples</text>
  <rect x="1020" y="175" width="388" height="52" rx="8" fill="#2D6CDF"/><rect x="1408" y="175" width="112" height="52" rx="8" fill="#DDE4ED" stroke="#B6C1CF"/>
  <text x="1214" y="207" class="body white center">35/45 positive · 77.78%</text><text x="1464" y="207" class="small center" fill="#17324D">10 negative</text>
  <text x="1020" y="275" class="h">Thresholded predictions · 0.5</text>
  <rect x="1020" y="295" width="422" height="52" rx="8" fill="#1F9D8B"/><rect x="1442" y="295" width="78" height="52" rx="8" fill="#DDE4ED" stroke="#B6C1CF"/>
  <text x="1231" y="327" class="body white center">38/45 positive · 84.44%</text><text x="1481" y="327" class="small center" fill="#17324D">7 neg.</text>

  <rect x="1020" y="395" width="155" height="100" rx="12" fill="#F5F7FA" stroke="#6B7C93" stroke-width="2"/><text x="1097" y="425" class="body center">Model accuracy</text><text x="1097" y="469" class="metric center">75.56%</text>
  <rect x="1190" y="395" width="165" height="100" rx="12" fill="#FFF8EC" stroke="#E98B2A" stroke-width="2"/><text x="1272" y="418" class="body center"><tspan x="1272">All-positive</tspan><tspan x="1272" dy="21">baseline</tspan></text><text x="1272" y="480" class="metric center">77.78%</text>
  <rect x="1370" y="395" width="170" height="100" rx="12" fill="#FFF0F0" stroke="#C94C4C" stroke-width="2"/><text x="1455" y="425" class="body center">Discrimination</text><text x="1455" y="469" class="h center">AUROC 0.5629</text>

  <text x="1020" y="555" class="h">Confusion matrix</text>
  <rect x="1020" y="575" width="115" height="70" rx="10" fill="#E8F7F4" stroke="#1F9D8B"/><rect x="1145" y="575" width="115" height="70" rx="10" fill="#FFF3E8" stroke="#E98B2A"/>
  <rect x="1020" y="655" width="115" height="70" rx="10" fill="#FFF3E8" stroke="#E98B2A"/><rect x="1145" y="655" width="115" height="70" rx="10" fill="#E8F7F4" stroke="#1F9D8B"/>
  <text x="1077" y="618" class="h center">TP 31</text><text x="1202" y="618" class="body center">FN 4</text><text x="1077" y="698" class="body center">FP 7</text><text x="1202" y="698" class="h center">TN 3</text>
  <rect x="1290" y="555" width="250" height="170" rx="14" fill="#FFF0F0" stroke="#C94C4C" stroke-width="2"/>
  <text x="1312" y="592" class="h">Representative finding</text><text x="1312" y="632" class="body"><tspan x="1312" dy="0">Accuracy was below the</tspan><tspan x="1312" dy="28">all-positive baseline;</tspan><tspan x="1312" dy="28">AUROC exposed weak ranking.</tspan></text>
  <rect x="1020" y="775" width="520" height="60" rx="12" fill="#F5F7FA" stroke="#B6C1CF"/>
  <text x="1280" y="812" class="body center">Next: harmonise · repeat splits · quantify uncertainty</text>
</svg>
